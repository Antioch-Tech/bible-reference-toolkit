# This workflow will do a clean installation of node dependencies and run tests/build per package without using Nx Cloud

name: Node.js CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - uses: actions/checkout@v3
    - name: Use Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Run package tests
      run: |
        set -e
        echo "Running tests for packages..."
        for pkg in packages/*; do
          if [ -f "$pkg/package.json" ]; then
            echo "==> $pkg"
            (cd "$pkg" && bun run test)
          fi
        done

    - name: Build packages
      if: success()
      run: |
        set -e
        echo "Building packages (if build script exists)..."
        for pkg in packages/*; do
          if [ -f "$pkg/package.json" ]; then
            if grep -q '"build"' "$pkg/package.json"; then
              echo "==> building $pkg"
              (cd "$pkg" && bun run build || true)
            fi
          fi
        done
